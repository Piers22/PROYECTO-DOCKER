services:

  web:
    image: nginx:latest
    container_name: web01
    ports:
      - "4001:80"
    depends_on:
      - api

  api:
    image: eclipse-temurin:17
    container_name: api01
    ports:
      - "4002:8080"
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: bd
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "4003:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
